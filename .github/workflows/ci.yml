name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 配布対象の macOS に加え、Linux でも通ることを確かめる(Electron のパスは OS ごとに解決する)。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
          node --check renderer/mini.js
      - name: Smoke tests
        # Linux はディスプレイが無いので仮想ディスプレイ上で起動する
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm test' || 'npm test' }}

  pack:
    # electron-builder の配布パッケージングが通るかを確認する(更新時の回帰検知)。
    # 署名はしない(--dir)。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package (unsigned, --dir)
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
